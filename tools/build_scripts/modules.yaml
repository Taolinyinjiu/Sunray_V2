# Sunray 构建模块配置文件 - 简化版本
# 直接基于 build_deprecated 目录的构建脚本

# ========== 模块定义 ==========
modules:
  # Sunray重构 UAV_Control
  uav_control:
    description: "Sunray 重构中的uav_control"
    source_path: "control/sunray_uav_control"
    build_path: "build/sunray_uav_control"
    dependencies: []
  ugv_control:
    description: "Sunray 重构中的ugv_control"
    source_path: "control/sunray_ugv_control"
    build_path: "build/sunray_ugv_control"
    dependencies: [sunray_msgs, sunray_common]
  control_tools:
    description: "为控制模块设计的一些工具"
    source_path: "control/control_tools"
    build_path: "build/control_tools"
    dependencies: []

  # uav_control_example
  sunray_uav_control_example:
    description: "sunray项目中uav单机控制示例 - 无其他模块辅助，属于基本实例部分"
    source_path: "examples/sunray_uav_control_example"
    build_path: "build/sunray_uav_control_example"
    dependencies: []

  # 规划模块功能包

  sunray_planner_msgs:
    description: "planning模块内部使用消息,用于适配多个planner的自定义消息"
    source_path: "planning/sunray_planner_msgs"
    build_path: "build/sunray_planner_msgs"
    dependencies: [""]

  ego_planner_swarm:
    description: "ego_planner_swarm 功能包"
    source_path: "planning/source_planners/ego_planner_swarm"
    build_path: "build/ego_planner_swarm"
    dependencies: ["sunray_planner_msgs"]

  diff_planner:
    description: "Diff Planner"
    source_path: "planning/source_planners/diff_planner"
    build_path: "build/diff_planner"
    dependencies: ["sunray_planner_msgs"]

  # SUPER还在适配中
  super_planner:
    description: "MARS LAB Planner"
    source_path: "planning/source_planners/SUPER"
    build_path: "build/SUPER"
    dependencies: []

  # Sunray 系列无人机规划模块核心
  sunray_planning:
    description: "Sunray unified planning entry"
    source_path: "planning/sunray_planning"
    build_path: "build/sunray_planning"
    dependencies: ["sunray_msgs", "sunray_common", "sunray_planner_msgs"]

  sunray_planner_tools:
    description: "Planning helper tools and bridge nodes"
    source_path: "planning/sunray_planner_tools"
    build_path: "build/sunray_planner_tools"
    dependencies: ["sunray_msgs"]

  sunray_msgs:
    description: "Sunray 重构中的测试demo"
    source_path: "common/sunray_msgs"
    build_path: "build/sunray_msgs"
    dependencies: []
  sunray_common:
    description: "Sunray 重构中的测试demo"
    source_path: "common/sunray_common"
    build_path: "build/sunray_common"
    dependencies: []
  # 仿真模块功能包
  simulator_utils:
    description: "simulator_utils 功能包"
    source_path: "simulation/simulator_utils"
    build_path: "build/simulator_utils"
    dependencies: []

  sunray_simulator:
    description: "sunray_simulator 功能包"
    source_path: "simulation/sunray_simulator"
    build_path: "build/sunray_simulator"
    dependencies: ["sunray_planning"]
  # 驱动模块功能包

  sunray_mavros:
    description: "sunray_mavros 功能包"
    source_path: "drivers/sunray_mavros"
    build_path: "build/sunray_mavros"
    dependencies: []
  vrpn_client_ros:
    description: "vrpn_client_ros 功能包"
    source_path: "drivers/vrpn_client_ros"
    build_path: "build/vrpn_client_ros"
    dependencies: []
  sunray_gimbal:
    description: "sunray_gimbal 功能包"
    source_path: "drivers/sunray_gimbal"
    build_path: "build/sunray_gimbal"
    dependencies: []
  realsense2_camera:
    description: "localization_fusion 功能包"
    source_path: "drivers/realsense2_camera"
    build_path: "build/realsense2_camera"
    dependencies: [sunray_msgs]
  livox_ros_driver2:
    description: "livox_ros_driver2 功能包"
    source_path: "drivers/livox_ros_driver2"
    build_path: "build/livox_ros_driver2"
    dependencies: []
  web_cam:
    description: "web_cam 功能包"
    source_path: "drivers/web_cam"
    build_path: "build/web_cam"
    dependencies: []
  turn_on_wheeltec_robot:
    description: "turn_on_wheeltec_robot 功能包"
    source_path: "drivers/turn_on_wheeltec_robot"
    build_path: "build/turn_on_wheeltec_robot"
    dependencies: []
  # 定位模块功能包
  localization_fusion:
    description: "localization_fusion 功能包"
    source_path: "localization/localization_fusion"
    build_path: "build/localization_fusion"
    dependencies: [sunray_msgs]
  
  vins_fusion:
    description: "localization_fusion 功能包"
    source_path: "localization/vins-fusion"
    build_path: "build/vins-fusion"
    dependencies: [sunray_msgs]
  vins_fusion_GPU:
    description: "localization_fusion 功能包"
    source_path: "localization/vins-fusion-gpu"
    build_path: "build/vins-fusion-gpu"
    dependencies: [sunray_msgs]


  fast_lio:
    description: "fast_lio 功能包"
    source_path: "localization/fast_lio"
    build_path: "build/fast_lio"
    dependencies: []
  ekf_odometry:
    description: "ekf_odometry 功能包"
    source_path: "localization/ekf_odometry"
    build_path: "build/ekf_odometry"
    dependencies: []
  
  sunray_mocap:
    description: "sunray_mocap 功能包"
    source_path: "localization/sunray_mocap"
    build_path: "build/sunray_mocap"
    dependencies: []
  sunray_viobot:
    description: "sunray_viobot 功能包"
    source_path: "localization/sunray_viobot"
    build_path: "build/sunray_viobot"
    dependencies: []
  # 集群功能包
  sunray_swarm_control:
    description: "sunray_swarm_control 功能包"
    source_path: "swarm/"
    build_path: "build/sunray_swarm_control"
    dependencies: [sunray_msgs]

# ========== 预定义组 ==========
# 直接基于 build_deprecated 目录的脚本内容
groups:
  # common测试
  common_test:
    description: "common测试"
    modules: []
  # control测试
  control_test:
    description: "control测试"
    modules: ["uav_control"]
  # localization_fusion 测试用
  localization_fusion_test:
    description: "localization_fusion测试包"
    modules: ["sunray_mavros", "vrpn_client_ros", "localization_fusion"]

  # 仿真
  Simulation:
    description: "仿真功能包"
    modules: ["sunray_simulator"]

  # 机型分类
  S-150-Basic:
    description: "Sunray-150-基础款功能包"
    modules: ["sunray_mavros", "vrpn_client_ros", "web_cam", "sunray_mocap"]

  S-150-Lidar:
    description: "Sunray-150-三维激光雷达款功能包"
    modules:
      [
        "sunray_mavros",
        "vrpn_client_ros",
        "web_cam",
        "livox_ros_driver2",
        "sunray_mocap",
        "fast_lio",
      ]

  S-150-Stereo:
    description: "Sunray-150-双目款功能包"
    modules:
      ["sunray_mavros", "vrpn_client_ros", "sunray_mocap", "sunray_viobot"]

  S-300-Standard:
    description: "Sunray-300-标准款功能包"
    modules:
      [
        "sunray_mavros",
        "vrpn_client_ros",
        "web_cam",
        "livox_ros_driver2",
        "sunray_mocap",
        "fast_lio",
        "sunray_gimbal",
      ]

  Swarm:
    description: "集群功能包"
    modules:
      [
        "sunray_common",
        "sunray_msgs",
        "sunray_mavros",
        "vrpn_client_ros",
        "localization_fusion",
        "uav_control",
        "sunray_swarm_control",
        "sunray_simulator",
      ]

  UGV:
    description: "UGV 控制、定位、仿真与底盘驱动功能包"
    modules:
      [
        "control_tools",
        "sunray_common",
        "sunray_msgs",
        "vrpn_client_ros",
        "sunray_mocap",
        "localization_fusion",
        "ugv_control",
        "turn_on_wheeltec_robot",
        "sunray_simulator",
      ]

# ========== 构建配置 ==========
build_config:
  default_jobs: "auto"
  catkin_command: "catkin_make"
