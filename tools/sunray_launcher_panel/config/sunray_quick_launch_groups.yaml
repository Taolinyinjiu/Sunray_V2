quick_launch_groups:
  - category: "sunray_mavros_sim"
    scripts:
      - title: "navrl_sim"
        description: "sunray_mavros_sim 仿真 + NavRL 适配 + 定位融合 + 无人机控制 + NavRL navigation_node"
        items:
          - title: "sunray_mavros_sim"
            ref: "sunray_mavros_sim/sunray_mavros_sim"
            delay_sec: 2.0

          - title: "NavRL2Sunray_sim"
            ref: "sunray_mavros_sim/NavRL2Sunray_sim"
            delay_sec: 1.0

          - title: "localization_fusion"
            ref: "定位融合/无人机定位融合"
            delay_sec: 1.0

          - title: "sunray_uav_control"
            ref: "无人机控制/单机无人机控制"
            args:
              - "agent_name:=uav"
              - "agent_id:=1"
              - "enable_uav_control_monitor:=true"
            delay_sec: 1.0

          - title: "NavRLTerminalControl"
            ref: "sunray_mavros_sim/NavRLTerminalControl"
            delay_sec: 0.5

          - title: "手动启动 NavRL navigation_node"
            command: |
              echo ""
              echo "请在新终端手动执行 NavRL navigation_node："
              echo ""
              echo "cd /home/amov/Sunray_v2"
              echo "source devel/setup.bash"
              echo "source /home/amov/miniconda3/etc/profile.d/conda.sh"
              echo "conda activate NavRL"
              echo "rosrun navigation_runner navigation_node.py"
              echo ""
              echo "如果当前终端已经配置好 ROS 和 conda，也可以只执行："
              echo "conda activate NavRL && rosrun navigation_runner navigation_node.py"
              echo ""
              read -r -p "按 Enter 关闭这个提示终端..."

  - category: "pengyu_sim"
    scripts:
      - title: "单无人机控制验证（pengyu_sim）"
        description: "pengyu_sim无人机仿真节点 + 定位融合节点 + 无人机控制节点"
        items:
          - ref: "pengyu_sim仿真器/无人机动力学仿真"
            delay_sec: 2.0
          - ref: "定位融合/无人机定位融合"
            delay_sec: 2.0
          - ref: "无人机控制/单机无人机控制（pengyu_sim）"

      - title: "单无人机规划验证（pengyu_sim）"
        description: "pengyu_sim地图/局部点云 + pengyu_sim无人机仿真节点 + 定位融合节点 + 无人机控制节点 + diff 规划节点"
        items:
          - ref: "pengyu_sim仿真器/全局点云发布"
            delay_sec: 0.5
          - ref: "pengyu_sim仿真器/局部点云渲染"
            delay_sec: 0.5
          - ref: "pengyu_sim仿真器/无人机动力学仿真"
            delay_sec: 1.0
          - ref: "定位融合/无人机定位融合"
            delay_sec: 1.0
          - ref: "无人机控制/单机无人机控制（pengyu_sim）"
            delay_sec: 1.0
          - ref: "路径规划/Sunray Planning Diff"

      - title: "单无人车控制验证（pengyu_sim）"
        description: "pengyu_sim无人车仿真节点 + 定位融合节点 + 无人车控制节点"
        items:
          - ref: "pengyu_sim仿真器/无人车动力学仿真"
            delay_sec: 1.0
          - ref: "定位融合/无人车定位融合"
            delay_sec: 1.0
          - ref: "无人车控制/单车无人车控制"

      - title: "6机无人机集群仿真（pengyu_sim）"
        description: "pengyu_sim无人机仿真节点*6 + 定位融合节点*6 + 无人机控制节点*6 + 无人机集群控制节点*6"
        items:
          - ref: "pengyu_sim仿真器/集群无人机动力学仿真"
            delay_sec: 1.5
          - ref: "定位融合/集群无人机定位融合"
            delay_sec: 1.0
          - ref: "无人机控制/集群无人机控制（pengyu_sim）"
            delay_sec: 1.0
          - ref: "无人机集群控制/无人机集群控制仿真"

      - title: "6车无人车集群仿真（pengyu_sim）"
        description: "pengyu_sim无人车仿真节点*6 + 定位融合节点*6 + 无人车控制节点*6 + 无人车集群控制节点*6"
        items:
          - ref: "pengyu_sim仿真器/集群无人车动力学仿真"
            delay_sec: 1.5
          - ref: "定位融合/集群无人车定位融合"
            delay_sec: 1.0
          - ref: "无人车控制/集群无人车控制"
            delay_sec: 1.0
          - ref: "无人车集群控制/无人车集群控制仿真"

  - category: "Gazebo"
    scripts:
      - title: "Gazebo 单无人机仿真占位"
        description: "占位脚本：后续用于接入 Gazebo 仿真链路"
        items:
          - ref: "Gazebo仿真器/Gazebo 单无人机"

      - title: "Gazebo 单无人机控制验证"
        description: "Gazebo单无人机仿真节点 + 无人机控制节点"
        items:
          - ref: "Gazebo仿真器/Gazebo 单无人机"
            delay_sec: 2.0
          - ref: "无人机控制/单机无人机控制（Gazebo）"

  - category: "真机"
    scripts:
      - title: "真机单无人机联调占位"
        description: "占位脚本：后续用于接入真机联调链路"
        items:
          - ref: "Sunray简易地面站/Sunray简易地面站"
