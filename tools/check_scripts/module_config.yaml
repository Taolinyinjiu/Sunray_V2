      - name: OpenCV
        version: "4"
        hint: "sudo apt install libopencv-dev"
      - name: Ceres
        hint: "sudo apt install libceres-dev"
      - name: Eigen3
        hint: "sudo apt install libeigen3-dev"
      - name: Boost
        hint: "sudo apt install libboost-all-dev"

  vins_fusion_GPU:
    cmake_packages:
      - name: OpenCV
        version: "4"
