      - name: PCL
        hint: "sudo apt install libpcl-dev"
      - name: Eigen3
        hint: "sudo apt install libeigen3-dev"
      - name: PythonLibs
        hint: "sudo apt install python3-dev"
    headers:
      - name: matplotlibcpp.h
        hint: "Provide matplotlibcpp.h in a compiler include path, or install it under /usr/local/include."

  open3d_loc:
    cmake_packages:
      - name: Open3D
        hint: "Install Open3D C++ and set Open3D_DIR or Open3D_ROOT if it is installed outside standard paths."
    libraries:
      - name: c++
        title: "libc++"
        hint: "sudo apt install libc++-dev"
      - name: c++abi
