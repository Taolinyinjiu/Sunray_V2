# UGV控制配置文件

# 无人车ID
ugv_id: "ugv_1"

# 底盘类型：1=麦克纳姆轮，2=差速轮
drive_type: 2

# 控制器参数
kp_linear: 0.5
kp_angular: 1.0
max_linear_vel: 1.0
max_angular_vel: 1.0

# 差速轮 MOVE_POINT 倒车策略
# enable_reverse: true 时，近距离目标在车身后方可倒车抵达
# reverse_angle_threshold: 触发倒车的最小后方夹角，单位 rad，2.09rad 约等于 120deg
# reverse_distance_threshold: 只在目标距离不超过该值时允许倒车，单位 m
# reverse_speed_ratio: 倒车速度相对前进限速的比例
# final_yaw_distance_threshold: 距目标多近时切换为原地收最终 yaw，单位 m
enable_reverse: true
reverse_angle_threshold: 2.09
reverse_distance_threshold: 0.8
reverse_speed_ratio: 0.6
final_yaw_distance_threshold: 0.05

# 速度命令超时参数
wait_velcmd_time: 5.0

# 点位到达判定阈值
point_pos_tolerance: 0.05
point_yaw_tolerance: 0.10

# 地理围栏参数
fence_min_x: -10.0
fence_min_y: -10.0
fence_min_z: -1.0
fence_max_x: 10.0
fence_max_y: 10.0
fence_max_z: 1.0
