# UGV控制配置文件

# 无人车ID
ugv_id: "ugv_1"

# 控制器类型：differential_drive 或 mecanum_wheel
controller_type: "mecanum_wheel"

# 控制器参数
kp_linear: 0.5
kp_angular: 1.0
max_linear_vel: 1.0
max_angular_vel: 1.0

# 地理围栏参数
fence_min_x: -10.0
fence_min_y: -10.0
fence_min_z: -1.0
fence_max_x: 10.0
fence_max_y: 10.0
fence_max_z: 1.0