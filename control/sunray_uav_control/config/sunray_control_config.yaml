# -------------------本文件中所设置的参数，在uav_control_fsm中使用yaml-cpp库进行读取，launch文件仅传递config.yaml路径----------------------

# -------------------基本参数-----------------------
basic_param:
    # 无人机质量
    mass_kg: 0.96
    # 重力加速度
    gravity: 9.8
    # 归一化悬停推力 (从px4的日志中直接读取)
    hover_thrust_precent: 0.375 
    # 控制器类型 0:px4_position_controller 1:sunray_attitude_controller 2:rl_raptor_controller
    controller_types: 1
    # 控制器更新频率(Hz)
    controller_update_frequency: 100
    # 状态机低频监督循环频率(Hz)
    supervisor_update_frequency: 10
    # 订阅的里程计话题名称,使用${uav_ns}表示当前uav标识符uav1之类的
    odom_topic_name: "${uav_ns}/sunray/localization/local_odom"
    # 里程计融合类型 0: disable 1：vision_pose 2:odometry 建议在当前里程计没有协方差时选择vision_pose
    fuse_odom_type: 1
    # 里程计融合的频率(需要根据外部里程计的更新频率决定，融合频率应当低于或者等于外部里程计更新频率)
    fuse_odom_frequency: 50

# -------------------保护参数-----------------------
protect_param:
    # 最低电压
    low_voltage: 13.2 # 4S battery
    # 达到最低电压时执行的操作 0:无操作 1:立即降落 2：返航并降落
    low_voltage_operate: 0
    # 是否允许在无遥控器连接时启动无人机
    control_with_no_rc: false
    # 当遥控器状态从连接变成丢失连接时，执行什么操作 0:无操作 1:降落 2:返回
    lost_with_rc: 1
    # 是否允许代码解锁无人机，如果为false需要通过遥控器的按键进行解锁
    arm_with_code: true
    # 是否允许代码起飞，如果为false需要通过推动遥控器的油门摇杆，发出起飞指令
    takeoff_with_code: true
    # 是否进行倾倒检测：当无人机姿态发生大幅度反转时上锁无人机
    check_flip: false
    # 最大倾斜角度(角度制)
    tilt_angle_max: 20
    # 当msg超时执行的操作，请注意，由于mavros超时必然导致setpoint无法得到有效的执行，也就是说mavros连接丢失，则无人机控制回到px4自身而非sunray控制节点，因此此处并不包含mavros的丢失
    # 0:无操作 1:立即降落 2：返航并降落
    msg_timeout_operate: 1

# -------------------消息超时参数-----------------------
# 此处均指正常工作，也就是持续有数据后丢失或者数据超时
msg_timeout_param: # 单位为秒(s)
    # 里程计
    local_odometry: 0.5
    # mavros链路(由于所有与px4有关的数据都是从mavros链路拿到的，因此这里直接判断链路稳定性)
    mavros_connect: 0.5
    # TODO：地面站链路(不工作则不会考虑)
    sunray_station: 0.5

# -------------------起飞降落参数-----------------------
takeoff_land_param:
    # 相对当前位置的起飞高度(米)
    takeoff_relative_height: 0.6
    # 起飞过程中的最大速度(m/s)
    takeoff_max_velocity: 0.5
    # 兼容旧配置：未显式指定 takeoff_ramp_time 时，作为缓升阶段时长
    motors_speedup_time: 4.0
    # 起飞预警阶段的怠速推力
    takeoff_idle_thrust: 0.08
    # 保持怠速推力用于警告的时长(s)
    takeoff_idle_hold_time: 2.0
    # 从怠速缓慢提升到可离地推力的时间(s)
    takeoff_ramp_time: 4.0
    # 起飞推力 RC 滤波时间常数(s)，用于抑制每拍目标抖动
    takeoff_thrust_filter_tau: 0.40
    # 离开暖机后继续平滑接管的时间(s)
    takeoff_thrust_handoff_time: 0.30
    # 指定降落模式 0：sunray land 1:px4.auto_land
    land_type: 0
    # 降落过程中的最大速度
    land_max_velocity: 0.5
    # 降落近地阶段推力 RC 滤波时间常数(s)
    land_thrust_filter_tau: 0.20
    # 近地阶段允许的最大推力
    land_near_ground_thrust_max: 0.31
    # 触地确认阶段允许的最大推力
    land_touchdown_thrust_max: 0.05

# -------------------运动误差与超时参数-----------------------
# 这里提到的运动超时参数可以这样来理解
# 当我们设置了一个点(x = 1,y = 1,z = 1)时，无人机会朝着目标飞去，但是未必能够精准的在(1,1,1)处悬停
# 他可能在(1.1,1.2,1.1)这样的周围平衡点悬停
# 运动超时参数描述的是，当误差大于本文件规定的运动误差参数，但是小于两倍的运动误差参数的时候
# 保持在稳定点悬停多长时间，认为运动结束
# takeoff和move_point表示的是运动的类型
# timeout
mission_error_param:
    takeoff: #takeoff表示运动类型
        timeout_s: 5.0 # timeout_s表示运动超时参数
        judge_stabile_time_s: 0.5 # judge_stabile_time_s 表示进入到运动误差死区时，判断达到稳定的时间
        pos_stabile_err_m: 0.15 # 表示稳定状态下位置的误差范数
        vel_stabile_err_mps: 0.15 # 表示稳定状态下速度的误差范数

    move_point: #move_point表示运动类型
        timeout_s: 5.0 # timeout_s表示运动超时参数
        judge_stabile_time_s: 0.5 # judge_stabile_time_s 表示进入到运动误差死区时，判断达到稳定的时间
        pos_stabile_err_m: 0.15 # 表示稳定状态下位置的误差范数
        vel_stabile_err_mps: 0.15 # 表示稳定状态下速度的误差范数

# -------------------电子围栏参数-----------------------
# local系参数，针对local里程计，使用ROS标准右手系，X正方向超机头前方，Y正方向朝机头左侧，Z轴朝上
local_fence_param:
    x_max: 4.0
    x_min: -4.0
    y_max: 4.0
    y_min: -4.0
    z_max: 2.0
    z_min: 0.0 #如果你的使用场景中，起飞点并不是最低点，可以考虑酌情修改
# TODO：添加经纬高地理围栏参数

# -------------------飞行速度参数-----------------------
velocity_param:
    # 最大飞行速度(m/s)
    max_velocity:
        x_vel: 3.0
        y_vel: 3.0
        z_vel: 1.0
    # 遥控器控制时的最大速度
    max_velocity_with_rc:
        x_vel: 1.0
        y_vel: 1.0
        z_vel: 1.0
    # 在进行yaw(偏航)角的调整时最大的速度(角度/秒)(deg/s)
    yaw_rate: 30
# ------------------- Sunray Controller Param -----------
sunray_controller_param:
  # 控制器输出类型， 0:attitude+thrust  1:bodyrate+thrust
  # 使用attitude作为输出时，控制器的动态性能有所下降，误差增大
  control_type: 0
  # 姿态误差的表示方法 0 = 四元数误差法（简单，推荐）  1 = 几何SO3法（更精确）
  # 在没有高速率大机动的情况下，两者效果近似
  attitude_type: 1

  # 悬停推力估计器类型 0: 低通滤波器 1: RLS最小二乘法估计 2:卡尓曼滤波估计
  hover_thrust_estimator_type: 1
  # 位置环PID参数
  pos_kp: [1.5, 1.5, 1.5]
  pos_ki: [0.0, 0.0, 0.2]
  pos_kd: [0.0, 0.0, 0.0]
  # 速度环PID参数
  vel_kp: [2.0, 2.0, 1.5]
  vel_ki: [0.0, 0.0, 0.0]
  vel_kd: [0.0, 0.0, 0.0]
  # 位置/速度环反馈加速度限幅；太小会让控制器看起来“对误差不敏感”
  max_acc: 9.0
  # 姿态控制时间常数(s)：越小响应越快，太小会产生振荡，建议 0.1~0.5
  attitude_tau: 0.3
  # 是否记录日志(存储在Sunray仓库根目录的log目录下)
  log_enabled: false
