# -------------------本文件中所设置的参数，在uav_control_fsm中使用yaml-cpp库进行读取，launch文件仅传递config.yaml路径----------------------

# -------------------基本参数-----------------------
basic_param:
    # 无人机质量
    mass_kg: 0.96
    # 重力加速度
    gravity: 9.8
    # 归一化悬停推力 (从px4的日志中直接读取)
    hover_thrust_percent: 0.375
    # 控制器类型 0:px4_position_controller 1:sunray_attitude_controller 2:raptor_controller已移除，后续讨论如何处理类似问题
    controller_types: 1
    # 控制器更新频率(Hz)
    controller_update_frequency: 100
    # 状态机低频监督循环频率(Hz)
    supervisor_update_frequency: 10
    # 订阅的里程计话题名称,使用${agent_key}表示当前智能体标识符uav1之类的ros话题前缀
    odom_topic_name: "${agent_key}/sunray/localization/local_odom"
    # 里程计融合类型 0: disable 1：vision_pose 2:odometry 建议在当前里程计没有协方差时选择vision_pose
    fuse_odom_type: 1
    # 里程计融合的频率(需要根据外部里程计的更新频率决定，融合频率应当低于或者等于外部里程计更新频率)
    fuse_odom_frequency: 50

# -------------------保护参数-----------------------
protect_param:
    # 参数检查功能，通过mavros的服务检查px4中参数是否满足当前模式的要求(仿真中可以禁用以获得更好地调试体验)
    check_param: false
    # 最低电压
    low_voltage: 13.2 # 4S battery
    # 达到最低电压时执行的操作 0:无操作 1:立即降落 2：返航并降落
    low_voltage_operate: 0
    # 是否允许在无遥控器连接时启动无人机
    control_with_no_rc: false
    # 当遥控器状态从连接变成丢失连接时，执行什么操作 0:无操作 1:降落 2:返回
    lost_with_rc: 1
    # 是否允许代码解锁无人机，如果为false需要通过遥控器的按键进行解锁
    arm_with_code: true
    # 是否允许代码起飞，如果为false需要通过推动遥控器的油门摇杆，发出起飞指令
    takeoff_with_code: true
    # 是否进行倾倒检测：当无人机姿态发生大幅度反转时上锁无人机
    check_flip: false
    # 最大倾斜角度(角度制)
    tilt_angle_max: 20
    # 当msg超时执行的操作，请注意，由于mavros超时必然导致setpoint无法得到有效的执行，也就是说mavros连接丢失，则无人机控制回到px4自身而非sunray控制节点，因此此处并不包含mavros的丢失
    # 0:无操作 1:立即降落 2：返航并降落
    msg_timeout_operate: 1

# -------------------消息超时参数-----------------------
# 此处均指正常工作，也就是持续有数据后丢失或者数据超时
msg_timeout_param: # 单位为秒(s)
    # 里程计
    local_odometry: 0.5
    # mavros链路(由于所有与px4有关的数据都是从mavros链路拿到的，因此这里直接判断链路稳定性)
    mavros_connect: 0.5
    # TODO：地面站链路(不工作则不会考虑)
    sunray_station: 0.5

# -------------------起飞降落相关参数-----------------------
takeoff_land_param:
    # 相对当前位置的起飞高度(米)
    takeoff_relative_height: 0.6
    # 起飞过程中的最大速度(m/s)
    takeoff_max_velocity: 0.3
    # 指定降落模式 0：sunray land 1:px4.auto_land
    land_type: 0
    # 降落过程中的最大速度
    land_max_velocity: 0.30
    # 触发返航时，到达返航点后是否自动降落
    return_with_land: true

# -------------------到达稳定判定参数-----------------------
# 起飞过程和位置控制模式，使用该参数用于判断当前是否到达目标点并保持稳定
# 当位置误差和速度误差同时进入稳定范围，并持续保持 judge_stabile_time_s 秒后，认为当前任务已经到达目标
# 对于 move_point / move_point_body，yaw 误差和 yaw 角速度也必须同时进入稳定范围
# 当速度误差达到允许范围，并保持 3x judge_stabile_time_s 后，如果当前的位置误差小于最大位置误差,
# 则也认为当前任务达到了目标点,这是为了防止在某些外部干扰较大的影响下,无人机无法完成任务卡在当前环节
# 为了防止外部里程计漂移(同一个位置,3分钟后z轴高度降低了30cm这样的小幅度),
# 当速度误差达到允许范围并保持 10x judge_stabile_time_s 后,我们也会认为当前任务达到了目标
arrival_judge_param:
    judge_stabile_time_s: 1
    pos_stabile_err_m: 0.08
    vel_stabile_err_mps: 0.12
    max_pos_err_m: 0.3
    yaw_stabile_err_deg: 8.0
    yaw_rate_stabile_err_deg_s: 10.0

# -------------------电子围栏参数-----------------------
# TODO：该参数当前并未实际使用
# local系参数，针对local里程计，使用ROS标准右手系，X正方向超机头前方，Y正方向朝机头左侧，Z轴朝上
local_fence_param:
    x_max: 4.0
    x_min: -4.0
    y_max: 4.0
    y_min: -4.0
    z_max: 2.0
    z_min: 0.0 #如果你的使用场景中，起飞点并不是最低点，可以考虑酌情修改
# TODO：添加经纬高地理围栏参数

# -------------------飞行速度参数-----------------------
velocity_param:
    # 最大飞行速度(m/s)
    max_velocity:
        x_vel: 3.0
        y_vel: 3.0
        z_vel: 1.0
    # 遥控器控制时的最大速度
    max_velocity_with_rc:
        x_vel: 1.0
        y_vel: 1.0
        z_vel: 1.0
    # 在进行yaw(偏航)角调整时允许的最大角速度，单位为 deg/s
    # 含义：所有指定 yaw 角度的控制指令（move_point / move_velocity 等）都会
    # 通过斜率限速器逼近目标 yaw，逼近速率上限即此值；yaw_rate 控制指令同样
    # 会被钳位到 ±yaw_rate 范围内。该参数仅作为速度上限，不是平均速度。
    yaw_rate: 30
# ------------------- Sunray Controller Param -----------
sunray_controller_param:
  # 控制器输出类型， 0:attitude+thrust  1:bodyrate+thrust
  # 使用attitude作为输出时，控制器的动态性能有所下降，误差增大
  control_type: 1

  # 悬停推力估计器类型 0: 低通滤波器 1: RLS最小二乘法估计 2:卡尓曼滤波估计
  hover_thrust_estimator_type: 1
  # 位置环PID参数
  pos_kp: [1.5, 1.5, 1.5]
  pos_ki: [0.0, 0.0, 0.2]
  pos_kd: [0.0, 0.0, 0.0]
  # 速度环PID参数
  vel_kp: [2.0, 2.0, 3]
  vel_ki: [0.0, 0.0, 0.0]
  vel_kd: [0.0, 0.0, 0.0]
  # Sunray_Controller支持使用RC遥控器作为输入得到和PX4原生控制器一样的体验
  # 机体系速度控制采用“body-xy速度 + fixed_height”混合语义：
  # fixed_height 会复用 pos_kp.z 生成 z 方向速度指令，并使用 velocity_param.max_velocity.z_vel 限幅
  # 位置/速度环反馈加速度限幅；太小会让控制器看起来“对误差不敏感”
  max_acc: 9.0
  # 姿态控制时间常数(s)：越小响应越快，太小会产生振荡，建议 0.1~0.5
  attitude_tau: 0.3
