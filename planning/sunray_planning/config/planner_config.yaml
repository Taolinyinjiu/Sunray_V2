# 设计planner_list的目的在于，我们希望以一种简洁的方式，实现对不同planner的配置，并希望得到一定的兼容性

planner_list:
    # # Example planner的名称
    # Example:
    #   # planner_id 表示该规划器的序号，在sunray_planning.launch文件中，通过指定规划器的序号，来加载对应的参数
    #   planner_id: -1
    #   # planner_type 表示规划器的类型，目前用于区分不同planner适配器
    #   # 当前建议填写 ego, diff, fuel, super
    #   planner_type: ego
    #   # goal_topic 表示该planner订阅的目标输入话题
    #   # 例如 rviz 中常用的 /move_base_simple/goal，或者探索模式下的 /waypoint_generator/waypoints
    #   goal_topic: "/move_base_simple/goal"
    #   # position_cmd_topic 表示该planner输出的位置控制指令话题
    #   # 由于yaml文件无法实现读取动态的ros参数，但考虑到会有多机的需求，因此这里使用${uav_ns}作为前缀时，表示话题前加上无人机的标识符uav_name+uav_id
    #   # 假设当前为单机仿真，则输出话题为"/uav1/pos_cmd"
    #   position_cmd_topic: "${uav_ns}/pos_cmd"
    #   # odometry_topic 表示该planner订阅的里程计话题
    #   odometry_topic: "odom_world"

    EGO:
        # 规划器序号
        planner_id: 0
        # 规划器类型
        planner_type: ego
        # 目标点输入话题
        goal_topic: "${uav_ns}/planning/goal"
        # 目标点frame_id，当前主要用于构造PoseStamped
        goal_frame_id: "world"
        # 输出的位置控制指令话题
        position_cmd_topic: "${uav_ns}/pos_cmd"
        # planner内部状态话题
        planner_state_topic: "${uav_ns}/planning/ego_state"
        # 订阅的里程计话题
        odometry_topic: "odom_world"
        # position_cmd失效超时时间
        cmd_timeout_sec: 0.3
        # planner_state失效超时时间
        state_timeout_sec: 1.0

    DIFF:
        # 规划器序号
        planner_id: 1
        # 规划器类型
        planner_type: diff
        # 目标点输入话题
        goal_topic: "/goal"
        goal_frame_id: "world"
        # 输出的位置控制指令话题
        position_cmd_topic: "/diff_planner_position_cmd"
        planner_state_topic: ""
        # 订阅的里程计话题
        odometry_topic: "odom_world"
        cmd_timeout_sec: 0.3
        state_timeout_sec: 1.0

    FUEL:
        # 规划器序号
        planner_id: 2
        # 规划器类型
        planner_type: fuel
        # 目标点输入话题
        goal_topic: "/waypoint_generator/waypoints"
        # 输出的位置控制指令话题
        position_cmd_topic: "/planning/pos_cmd"
        # 订阅的里程计话题
        odometry_topic: "/odom_world"

    SUPER:
        # 规划器序号
        planner_id: 3
        # 规划器类型
        planner_type: super
        # 目标点输入话题
        goal_topic: "/planning/click_goal"
        goal_frame_id: "world"
        # 输出的位置控制指令话题
        position_cmd_topic: "/planning/pos_cmd"
        planner_state_topic: ""
        # 订阅的里程计话题
        odometry_topic: "/lidar_slam/odom"
        cmd_timeout_sec: 0.3
        state_timeout_sec: 1.0
