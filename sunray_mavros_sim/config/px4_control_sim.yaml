# Px4ControlSim 控制转换模块参数。
#
# 模块功能：
#   订阅 MAVROS setpoint 和当前 odom，把 PX4/MAVROS 风格控制指令转换成四个
#   电机期望转速 /<agent>/sunray_mavros_sim/cmd_RPM。
#
# 读取模块：
#   1. Px4ControlSim：读取本文件所有控制参数，并在模块内部创建 update 定时器。
#   2. Px4ControlSim 还会读取 quadrotor_simulator.yaml 里的部分 dynamics/* 和 motor/*。

# Px4ControlSim 内部 update 定时器频率，单位 Hz。
px4_update_rate: 200.0

# 支持的 MAVROS setpoint 说明：
#   1. /mavros/setpoint_raw/local 只支持 mavros_msgs/PositionTarget 的 FRAME_LOCAL_NED。
#      当前实现按本包全局坐标系中的位置、速度、加速度、yaw、yaw_rate 解释字段，
#      尚未实现 LOCAL_OFFSET_NED、BODY_NED、BODY_OFFSET_NED 的坐标转换。
#   2. PositionTarget 不支持 FORCE 位；acceleration_or_force 只按加速度前馈解释。
#   3. PositionTarget 的 x/y、vx/vy、ax/ay 必须成对启用，z、vz、az 可单独启用。
#   4. PositionTarget 不能把 position、velocity、acceleration、yaw、yaw_rate 全部忽略。
#   5. /mavros/setpoint_raw/attitude 只支持三类 AttitudeTarget：
#      - body_rate + thrust
#      - roll_pitch_yaw + thrust
#      - roll_pitch_yawrate + thrust
#      不支持 IGNORE_THRUST，也不支持更自由的 attitude/body_rate 混合模式。
#   6. 不支持的 setpoint 会被拒绝，并对同一类 type_mask/坐标系组合只打印一次告警。

# setpoint 超时时间，单位 s。
# 超过该时间没有收到“支持的” MAVROS setpoint 时，Px4ControlSim 会输出一次零电机 RPM，
# 随后如果不再继续发布 cmd_RPM，QuadrotorSimulator 会按 cmd_timeout 暂停仿真。
# 设置为 0 表示关闭 setpoint 超时检查。
setpoint_timeout: 0.5

# 位置环 PID 参数。
position_control:
  # x 方向位置比例增益。
  kp_x: 0.5

  # y 方向位置比例增益。
  kp_y: 0.5

  # z 方向位置比例增益。
  kp_z: 1.0

  # 位置控制有效时，setpoint 中 xy 速度前馈的增益。
  vel_ff_xy_gain_when_pos_active: 1.0

# 速度环 PID 参数。
velocity_control:
  # x 方向速度比例增益。
  kp_x: 1.0

  # y 方向速度比例增益。
  kp_y: 1.0

  # z 方向速度比例增益。
  kp_z: 1.0

  # x 方向速度积分增益。
  ki_x: 0.05

  # y 方向速度积分增益。
  ki_y: 0.05

  # z 方向速度积分增益。
  ki_z: 0.05

  # 速度环积分限幅。
  integral_limit: 1.0

  # xy 加速度指令低通滤波时间常数，单位 s。
  # 0 表示基本不滤波。
  acc_xy_lpf_tau: 0.08

  # setpoint 中 xy 加速度前馈增益。
  acc_ff_xy_gain: 1.0

# 姿态环 PID 参数。
attitude_control:
  # roll 姿态比例增益。
  kp_roll: 2.0

  # pitch 姿态比例增益。
  kp_pitch: 2.0

  # yaw 姿态比例增益。
  kp_yaw: 5.0

# 角速度环 PID 参数。
bodyrate_control:
  # roll 角速度比例增益。
  kp_roll: 0.5

  # pitch 角速度比例增益。
  kp_pitch: 0.5

  # yaw 角速度比例增益。
  kp_yaw: 0.8

  # roll 角速度积分增益。
  ki_roll: 0.0

  # pitch 角速度积分增益。
  ki_pitch: 0.0

  # yaw 角速度积分增益。
  ki_yaw: 0.0

  # 角速度环积分限幅。
  integral_limit: 1.0

# 控制限幅。
limits:
  # xy 平面最大速度，单位 m/s。
  max_vel_xy: 1.0

  # z 方向最大速度，单位 m/s。
  max_vel_z: 0.5

  # xy 平面最大加速度，单位 m/s^2。
  max_acc_xy: 1.0

  # z 方向最大加速度，单位 m/s^2。
  max_acc_z: 0.5

  # 最大倾角，单位 deg。
  max_tilt_deg: 15.0

  # 最大 roll/pitch 角速度，单位 rad/s。
  max_roll_pitch_rate: 0.35

  # 最大 yaw 角速度，单位 rad/s。
  max_yaw_rate: 3.14
