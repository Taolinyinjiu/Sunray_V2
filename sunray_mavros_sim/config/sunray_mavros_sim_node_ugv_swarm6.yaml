# sunray_mavros_sim 6 车集群主节点参数。
#
# 用途：
#   给 sunray_launcher_panel 的 UGV 集群一键脚本使用。

uav:
  # 本配置只启动 UGV，不启动 UAV。
  enable: false
  agent_name: uav
  agent_ids: [1]

ugv:
  # 同一个 sunray_mavros_sim_node 进程内创建 6 台无人车仿真。
  enable: true
  agent_name: ugv
  agent_ids: [1, 2, 3, 4, 5, 6]

# 兼容旧 UAV 读取逻辑的顶层参数；本配置下不使用。
agent_name: uav
agent_ids: [1]

# 全局坐标系 frame_id。
global_frame_id: map

# UGV 默认也启用感知链路：
#   发布公共全局地图；
#   每台无人车各自发布局部 MID360 点云。
enable_sensing: true

# 集群下终端输出较多，默认关闭周期状态面板。
enable_status_print: false
status_print_hz: 1.0
