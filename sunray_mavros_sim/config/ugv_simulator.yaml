# UgvSimulator 无人车轻量动力学参数。
#
# 模块功能：
#   订阅 /<ugv>/sunray/ugv_control/cmd_vel，积分平面运动，
#   发布 /<ugv>/sunray_mavros_sim/odom 和 /<ugv>/sunray_mavros_sim/imu。
#
# 读取模块：
#   UgvSimulator

ugv:
  # 无人车动力学更新和 odom/imu 发布频率，单位 Hz。
  publish_rate: 100.0

  # 底盘类型。
  # differential：差速轮，忽略 cmd_vel.linear.y。
  # mecanum：麦克纳姆轮，允许 cmd_vel.linear.y。
  drive_type: mecanum

  # cmd_vel 超时时间，单位 s。
  # 超过该时间未收到新指令时，仿真器按零速度指令逐步减速。
  cmd_timeout: 0.2

  # x 方向最大车体系速度，单位 m/s。
  max_linear_x: 3.0

  # y 方向最大车体系速度，单位 m/s。
  # differential 底盘会强制置零。
  max_linear_y: 3.0

  # 最大 yaw 角速度，单位 rad/s。
  max_angular_z: 3.0

  # 线速度变化率限制，单位 m/s^2。
  linear_acc_limit: 3.0

  # yaw 角速度变化率限制，单位 rad/s^2。
  angular_acc_limit: 6.0

  # odom pose/twist 中 x、y 协方差对角线。
  odom_covariance_xy: 0.001

  # odom pose/twist 中 yaw 协方差对角线。
  odom_covariance_yaw: 0.002

  # odom child_frame_id，默认会按 <agent>/base_link 生成。
  # 多车时通常不建议覆盖。
  # base_frame_id: ugv1/base_link

  # IMU frame_id，默认会按 <agent>/imu_link 生成。
  # 多车时通常不建议覆盖。
  # imu_frame_id: ugv1/imu_link
