# LocalMid360Simulator 局部 MID360 点云模块参数。
#
# 模块功能：
#   使用 GlobalMapServer 提供的全局点云和 QuadrotorSimulator 发布的 odom，
#   模拟 MID360 风格的全局坐标系局部点云、sensor 坐标系局部点云和深度图。
#
# 读取模块：
#   LocalMid360Simulator

# 雷达类型名称，只用于日志显示。
lidar_type: mid360

# 全局坐标系 frame_id 不在本文件单独配置。
# 它统一读取 sunray_mavros_sim_node.yaml 中的 global_frame_id。

# 传感器坐标系 frame_id。
# ~/sunray_mavros_sim/cloud_sensor_frame 和 depth_img 会使用该 frame。
# TF 会发布 global_frame_id -> sensor_frame_id。
sensor_frame_id: sensor

# 是否按 360 度水平视场模拟雷达。
# 1：水平 360 度；0：使用 yaw_fov 限制水平视场。
is_360lidar: 1

# 局部点云最大感知距离，单位 m。
sensing_horizon: 15.0

# 局部点云和深度图发布频率，单位 Hz。
sensing_rate: 10.0

# 极坐标角分辨率，单位 deg。
# 数值越小，角度栅格越密，输出点云越细，计算量也越大。
polar_resolution: 0.2

# 水平视场角，单位 deg。
# 只有 is_360lidar=0 时该参数才会限制水平视场。
yaw_fov: 360.0

# 垂直视场角，单位 deg。
vertical_fov: 90.0

# 最小有效量测距离，单位 m。
# 小于该距离的点会被过滤，避免雷达附近点干扰。
min_raylength: 1.0
