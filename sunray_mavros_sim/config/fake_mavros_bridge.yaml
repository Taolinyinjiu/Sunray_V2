# FakeMavrosBridge 假 MAVROS 桥接模块参数。
#
# 模块功能：
#   把 sunray_mavros_sim 内部 odom/imu 转发成 /<agent>/mavros/* 常用话题，
#   同时提供 set_mode、arming、param/get、param/set 等常见 MAVROS 服务。
#
# 读取模块：
#   FakeMavrosBridge

fake_mavros_bridge:
  # fake MAVROS 状态话题发布频率，单位 Hz。
  # 影响 /mavros/state、extended_state、sys_status、estimator_status 等。
  mavros_publish_rate: 50.0

  # 判断在地面的高度阈值，单位 m。
  on_ground_height_threshold_m: 0.05

  # 判断在地面的速度阈值，单位 m/s。
  on_ground_velocity_threshold_mps: 0.10

  # 假电池电压，单位 V，发布到 /mavros/sys_status。
  battery_voltage_v: 15.2

  # 假电池电流，单位 A，发布到 /mavros/sys_status。
  battery_current_a: 0.0

  # 假剩余电量，范围 0.0 到 1.0。
  battery_remaining: 0.9

  # 假系统负载原始值，发布到 /mavros/sys_status。
  system_load_raw: 150

  # 启动时 /mavros/state.connected 的初始值。
  start_connected: true

  # 启动时 /mavros/state.armed 的初始值。
  start_armed: true

  # 启动时 /mavros/state.manual_input 的初始值。
  start_manual_input: true

  # 启动时 /mavros/state.mode 的初始值。
  start_mode: OFFBOARD
