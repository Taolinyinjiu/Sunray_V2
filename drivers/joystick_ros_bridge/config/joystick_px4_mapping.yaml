# joystick_ros_bridge 默认配置
# PX4 RC 约定：roll/pitch/throttle/yaw 分别对应 RC1/RC2/RC3/RC4，坐标系遵循 NED。

# 手柄设备路径；当前系统识别到的是 /dev/input/js0，如果换手柄后编号变化，需要改这里。
device: /dev/input/js0

# 发布 sensor_msgs/Joy 的 ROS 话题名；本配置会过滤掉 axis4/axis5，只发布 axis0~axis3。
pub_joy_topic: /joy

# 节点读取手柄并发布话题的频率，单位 Hz。
publish_rate: 100.0

# 摇杆死区；绝对值小于该值的轴输入会被置 0，用于过滤摇杆轻微漂移。
deadzone: 0.05

# 没有新按键/摇杆事件时是否继续按固定频率重复发布最后一帧数据。
autorepeat: true

# 手柄实际轴数量查询失败时使用的兜底轴数量。
default_axes: 6

# 手柄实际按键数量查询失败时使用的兜底按键数量。
default_buttons: 13

# 发布到 /joy 的轴下标；axis4/axis5 不需要发布，所以这里仅保留 0~3。
pub_axis_indices: [0, 1, 2, 3]

# 发布到 /joy 的按键下标；只保留 X/Y/B/A 对应按键。
# 当前假设：button3=X，button0=Y，button1=B，button2=A。
pub_button_indices: [3, 0, 1, 2]

# 是否发布 MAVROS RC override；默认 true，会向 PX4 覆盖遥控器通道。
enable_rc_override: true

# MAVROS 遥控器覆盖话题；MAVROS 默认就是 /mavros/rc/override。
rc_override_topic: /uav1/mavros/rc/override

# 未映射 RC 通道的默认 PWM；本项目要求不映射通道默认发 1000。
rc_default: 1000

# 摇杆和按键映射到 RC 的 PWM 范围。
rc_min: 1000
rc_max: 2000
rc_neutral: 1500
rc_button_low: 1000
rc_button_high: 2000

# RC 通道配置。channel 使用 0 基下标：0=RC1，1=RC2，...，17=RC18。
# type=axis 时：source 是原始 joy axis 下标，in_min/in_max 描述输入端点，out_min/out_max 描述对应 PWM。
# type=button 时：source 是原始 joy button 下标，0 输出 rc_button_low，1 输出 rc_button_high。
rc_channels:
  # RC1 横滚：axis3=-1 表示向右飞，因此 RC1=2000；axis3=+1 表示向左飞，RC1=1000。
  - {channel: 0, type: axis, source: 3, in_min: -1.0, in_max: 1.0, out_min: 2000, out_max: 1000}

  # RC2 俯仰：axis2 反向，axis2=-1 表示前进，因此 RC2=1000；axis2=+1 表示后退，RC2=2000。
  - {channel: 1, type: axis, source: 2, in_min: -1.0, in_max: 1.0, out_min: 1000, out_max: 2000}

  # RC3 油门：axis1 反向，axis1=-1 表示上升，因此 RC3=2000；axis1=+1 表示下降，RC3=1000。
  - {channel: 2, type: axis, source: 1, in_min: -1.0, in_max: 1.0, out_min: 2000, out_max: 1000}

  # RC4 偏航：axis0=-1 表示向左转，因此 RC4=1000；axis0=+1 表示向右转，RC4=2000。
  - {channel: 3, type: axis, source: 0, in_min: -1.0, in_max: 1.0, out_min: 1000, out_max: 2000}

  # RC5：button3 是 X 键，默认 1000；每按下一次在 1000/2000 之间切换。
  - {channel: 4, type: button, source: 3, mode: toggle, low: 1000, high: 2000}

  # RC6：button0 是 Y 键，默认 1000；每按下一次在 1000/2000 之间切换。
  - {channel: 5, type: button, source: 0, mode: toggle, low: 1000, high: 2000}

  # RC7：button2 是 A 键，默认 1000；每按下一次在 1000/2000 之间切换。
  - {channel: 6, type: button, source: 2, mode: toggle, low: 1000, high: 2000}

  # RC8：button1 是 B 键，默认 1000；每按下一次在 1000/2000 之间切换。
  - {channel: 7, type: button, source: 1, mode: toggle, low: 1000, high: 2000}

# 是否在终端持续刷新显示遥控器状态。
print_status: true

# 终端刷新频率，单位 Hz；只影响显示，不影响 ROS 话题发布频率。
print_rate: 10.0
