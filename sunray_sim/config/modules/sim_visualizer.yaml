# SimVisualizer RViz 可视化模块参数。
#
# 模块功能：
#   订阅本包内部 odom、局部点云状态、碰撞状态，以及 UAV 专用的 cmd_RPM/fake MAVROS state，
#   合成为一个 visualization_msgs/MarkerArray 话题，方便 RViz 一次性显示：
#     1. UAV：X 型四旋翼机架、前方绿色电机、后方红色电机；
#     2. UGV：矩形车体、驾驶舱、四个车轮和绿色车头方向标识；
#     3. 机头/车头方向箭头、速度箭头；
#     4. 运行轨迹；
#     5. 头顶当前位置文字。
#
# 读取模块：
#   SimVisualizer
#
# 注意：
#   本模块只负责显示，不参与动力学、控制、IMU 或点云仿真计算。
#   UGV 模式不会订阅 /<ugv>/mavros/state 或 /<ugv>/sunray_sim/cmd_RPM，
#   这两个话题只用于 UAV 可视化状态。

visualizer:
  # 是否启用 RViz 可视化模块。
  # true：创建 SimVisualizer，发布 ~/sunray_sim/visualization。
  # false：不创建可视化模块，不影响其他仿真输出。
  enable: true

  # MarkerArray 发布频率，单位 Hz。
  # 该频率只影响 RViz 显示刷新，不影响动力学和点云频率。
  publish_rate: 10.0

  # MarkerArray 发布话题。
  # 留空时程序自动使用 /<agent>/sunray_sim/visualization。
  marker_topic: ""

  # 车辆 marker 整体缩放系数。
  # UAV 默认按 200 mm 轴距绘制：
  #   - marker_scale = 1.0：电机对角距离约 0.20 m；
  #   - marker_scale = 2.0：电机对角距离约 0.40 m。
  # UGV 默认按 250 mm 车长绘制：
  #   - marker_scale = 1.0：车体长度约 0.25 m；
  #   - marker_scale = 2.0：车体长度约 0.50 m。
  # 该参数只影响 RViz 显示大小，不影响动力学尺寸、质量或电机参数。
  marker_scale: 1.0

  # 轨迹最大保留点数。
  # 点数越多，RViz 中轨迹越长，但 MarkerArray 消息也会更大。
  path_max_points: 500

  # 轨迹点最小间隔，单位 m。
  # 车辆移动距离小于该值时不新增轨迹点，避免静止或悬停时轨迹点过密。
  path_min_interval: 0.15

  # 是否显示速度方向箭头。
  # true：速度大于 0.05 m/s 时显示蓝色速度箭头。
  # false：不显示速度箭头。
  show_velocity_arrow: true

  # 是否显示车辆头顶状态文字。
  # RViz 的 TEXT_VIEW_FACING 不支持真正加粗字体，这里使用较大的绿色文字增强可读性。
  show_status_text: true
