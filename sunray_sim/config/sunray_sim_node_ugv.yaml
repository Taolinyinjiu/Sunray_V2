# sunray_sim 单车 UGV 主节点参数。
#
# 用途：
#   给 sunray_launcher_panel 的单无人车一键脚本使用。

uav:
  enable: false
  agent_name: uav
  agent_ids: [1]

ugv:
  enable: true
  agent_name: ugv
  agent_ids: [1]

# 兼容旧 UAV 读取逻辑的顶层参数；本配置下不使用。
agent_name: uav
agent_ids: [1]

global_frame_id: map
enable_sensing: true
enable_status_print: true
status_print_hz: 1.0
