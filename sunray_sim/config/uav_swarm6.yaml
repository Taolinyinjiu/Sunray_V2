# sunray_sim 6 机无人机场景配置。
#
# 用途：
#   在同一个 sunray_sim_node 进程内启动 /uav1 到 /uav6，
#   适合 UAV 集群控制、集群规划和多机感知验证。
#
# 读取模块：
#   sunray_sim_node、SingleUavSimulator。

uav:
  # 启动 UAV 仿真。
  enable: true

  # 无人机名称前缀，最终命名空间为 /uav1 ... /uav6。
  agent_name: uav

  # 需要创建的 UAV 编号列表。
  agent_ids: [1, 2, 3, 4, 5, 6]

ugv:
  # 本场景不启动 UGV。
  enable: false
  agent_name: ugv
  agent_ids: [1]

# 全局坐标系 frame_id。
global_frame_id: map

# 集群验证默认启用感知链路：
#   发布一份公共全局地图；
#   每架 UAV 各自发布一份局部 MID360 点云。
enable_sensing: true

# 集群下终端输出较多，默认关闭周期状态面板。
enable_status_print: false
status_print_hz: 1.0

vehicles:
  uav1:
    init_x: 0.0
    init_y: 0.0
    init_z: 0.0
    init_yaw: 0.0

  uav2:
    init_x: 2.0
    init_y: 0.0
    init_z: 0.0
    init_yaw: 0.0

  uav3:
    init_x: 4.0
    init_y: 0.0
    init_z: 0.0
    init_yaw: 0.0

  uav4:
    init_x: 0.0
    init_y: 2.0
    init_z: 0.0
    init_yaw: 0.0

  uav5:
    init_x: 2.0
    init_y: 2.0
    init_z: 0.0
    init_yaw: 0.0

  uav6:
    init_x: 4.0
    init_y: 2.0
    init_z: 0.0
    init_yaw: 0.0
