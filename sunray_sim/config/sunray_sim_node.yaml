# sunray_sim_node 主节点参数。
#
# 读取模块：
#   sunray_sim_node.cpp
#
# 说明：
#   本文件只放“整个单节点仿真器的通用参数”，包括无人机名称、无人机编号列表和统一状态打印。
#   地图、雷达、动力学、PX4 控制和 fake MAVROS 的业务参数放在各自 YAML 中。

# UAV/UGV 启用配置。
#
# uav.enable=true 时，主节点会为 uav.agent_ids 中的每个编号创建一套 SingleUavSimulator。
# ugv.enable=true 时，主节点会为 ugv.agent_ids 中的每个编号创建一套 SingleUgvSimulator。
uav:
  # 是否启动无人机仿真。
  enable: true

  # 无人机名称前缀。
  # 会和 agent_ids 中的编号一起组成运行时实际无人机话题前缀。
  # 例如 agent_name=uav、agent_ids=[1,2] 时，会创建 /uav1 和 /uav2。
  agent_name: uav

  # 无人机编号列表。
  # 列表中只有一个编号时就是单机；多个编号时就是集群。
  agent_ids: [1]

ugv:
  # 是否启动无人车仿真。
  # true 时会创建 SingleUgvSimulator，订阅 /ugvX/sunray/ugv_control/cmd_vel，
  # 发布 /ugvX/sunray_sim/odom 和 /ugvX/sunray_sim/imu。
  enable: false

  # 无人车名称前缀。
  agent_name: ugv

  # 无人车编号列表。
  agent_ids: [1]

# 兼容旧配置的顶层 UAV 参数。
# 新配置优先读取 uav/agent_name 和 uav/agent_ids；保留这两项是为了旧脚本不失效。
agent_name: uav

agent_ids: [1]

# 全局坐标系 frame_id。
# 读取模块：
#   1. GlobalMapServer：作为全局地图点云 /sunray_sim/global_cloud 的 header.frame_id。
#   2. LocalMid360Simulator：作为 ~/sunray_sim/cloud_world_frame 的 header.frame_id，
#      也是 TF 的父坐标系，即 global_frame_id -> sensor_frame_id。
#   3. QuadrotorSimulator：作为 ~/sunray_sim/odom 和 ~/sunray_sim/navsat 的 header.frame_id。
#   4. FakeMavrosBridge：不直接读取本参数，但它会转发 QuadrotorSimulator 的 odom/imu，
#      所以 ~/mavros/local_position/odom 会继承这里设置的 frame_id。
# 推荐：
#   对接 NavRL/map_manager 时使用 map，因为 map_manager 的点云和 RViz 固定坐标系使用 map。
#   如果你的其他模块固定使用 world，可以改成 world，但要保证全局地图、odom、局部点云语义一致。
global_frame_id: map

# 是否启用感知链路。
# true：
#   启动 GlobalMapServer，读取 PCD 并发布全局地图点云；
#   启动 LocalMid360Simulator，基于全局地图和无人机 odom 生成局部 MID360 点云。
# false：
#   不启动 GlobalMapServer 和 LocalMid360Simulator；
#   只启动单机动力学、PX4 控制转换、fake MAVROS 和可选 SimVisualizer，
#   仍然发布 odom/imu/navsat/MAVROS facade。
enable_sensing: true

# 是否在终端周期打印所有关键模块的统一状态。
# true：主节点定时依次调用 GlobalMapServer、LocalMid360Simulator、
#       QuadrotorSimulator、Px4ControlSim、FakeMavrosBridge、SimVisualizer 的 printStatus()。
# false：不打印周期状态，只保留 ROS 常规启动日志和告警。
enable_status_print: true

# 统一状态打印频率，单位 Hz。
# 只由 sunray_sim_node.cpp 读取，各模块内部不再单独读取打印频率。
status_print_hz: 1.0
