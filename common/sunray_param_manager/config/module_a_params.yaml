# A 模块私有参数：模拟 localization。
#
# 实际加载路径：
#   /uav1/module_a_localization/module_a/...
#
# 本模块故意只在启动时读取一次参数，用来演示：
#   - 初始位置、传感器安装外参、基础仿真配置等参数通常属于启动配置。
#   - 如果运行中 rosparam set 修改这些值，节点内部变量不会自动变化。
#   - 想让这类参数生效，需要重启节点，或者自己在代码中设计重载逻辑。

module_a:
  # 模拟 odom 发布频率，单位 Hz。
  publish_rate_hz: 20.0

  # 模拟初始位置，单位 m。
  start_x: 0.0
  start_y: 0.0

  # 模拟飞行高度，单位 m。
  height: 1.0

  # 模拟定位源在 x 方向的运动速度，单位 m/s。
  simulated_vx: 0.05
